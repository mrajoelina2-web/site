<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2f26"/>
      <stop offset="100%" stop-color="#1a1d15"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#baseGrad)"/>

  <!-- Taches façon camouflage -->
  <g opacity="0.55">
    <ellipse cx="220" cy="180" rx="260" ry="150" fill="#4a4f3e" transform="rotate(-15 220 180)"/>
    <ellipse cx="650" cy="320" rx="200" ry="130" fill="#3a3f33" transform="rotate(25 650 320)"/>
    <ellipse cx="1100" cy="150" rx="300" ry="170" fill="#5c6b3f" opacity="0.5" transform="rotate(-10 1100 150)"/>
    <ellipse cx="1500" cy="380" rx="240" ry="140" fill="#4a4f3e" transform="rotate(18 1500 380)"/>
    <ellipse cx="1800" cy="150" rx="180" ry="120" fill="#3a3f33" transform="rotate(-30 1800 150)"/>

    <ellipse cx="150" cy="600" rx="220" ry="150" fill="#3a3f33" transform="rotate(10 150 600)"/>
    <ellipse cx="550" cy="750" rx="280" ry="160" fill="#5c6b3f" opacity="0.45" transform="rotate(-20 550 750)"/>
    <ellipse cx="950" cy="600" rx="240" ry="150" fill="#4a4f3e" transform="rotate(15 950 600)"/>
    <ellipse cx="1350" cy="780" rx="260" ry="170" fill="#3a3f33" transform="rotate(-25 1350 780)"/>
    <ellipse cx="1750" cy="650" rx="230" ry="140" fill="#4a4f3e" transform="rotate(20 1750 650)"/>

    <ellipse cx="350" cy="950" rx="250" ry="130" fill="#5c6b3f" opacity="0.4" transform="rotate(-12 350 950)"/>
    <ellipse cx="800" cy="1000" rx="220" ry="140" fill="#3a3f33" transform="rotate(22 800 1000)"/>
    <ellipse cx="1250" cy="980" rx="260" ry="150" fill="#4a4f3e" transform="rotate(-18 1250 980)"/>
    <ellipse cx="1650" cy="950" rx="230" ry="140" fill="#3a3f33" transform="rotate(14 1650 950)"/>
  </g>

  <!-- Voile sombre + vignette pour la lisibilité -->
  <rect width="1920" height="1080" fill="#14160f" opacity="0.35"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
